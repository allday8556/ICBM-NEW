name: CI

# CI scheduling policy (Issue #143). The full suite runs once per merge-candidate exact HEAD,
# never on work-in-progress:
# - push to main and workflow_dispatch: always the full suite;
# - a ready (non-draft) PR: the full suite on every new HEAD, since a new commit makes any earlier
#   green run stale (check runs belong to one exact commit and are never inherited);
# - a draft PR (WIP preservation): lint/format/type only, and no "CI gate" result at all;
# - a ready PR that touches only research/evidence Markdown: lint/format/type plus the unit suite
#   (which holds the doc-contract tests), not the Windows/Ubuntu runtime and acceptance suites.
# Branch pushes without a PR run nothing. "CI gate" is the single merge-readiness result.
#
# Exact-HEAD invariant: on a pull_request event actions/checkout defaults to the ephemeral
# refs/pull/N/merge commit, which is base + head and is not the stated commit. Every job therefore
# pins ref to github.event.pull_request.head.sha (github.sha on push/dispatch), so a green "CI gate"
# means that exact HEAD passed, with nothing from the base branch mixed in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify this run (full | docs | wip)
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            mode=full
          elif [ "$DRAFT" = "true" ]; then
            mode=wip
          else
            # The checkout is pinned to the exact head SHA, not to the merge ref that used to carry
            # the base commit as a parent, so make both endpoints present before comparing them.
            git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
            files="$(git diff --name-only --no-renames "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
            mode=docs
            if [ -z "$files" ]; then
              mode=full
            fi
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                # Canonical policy, contracts, acceptance and CI itself always take the full gate.
                .github/*|ROADMAP.md|CLAUDE.md|docs/ARCHITECTURE.md|docs/UI_SOURCE_OF_TRUTH.md) mode=full ;;
                docs/adr/*|docs/acceptance/*|docs/architecture/*|docs/GLOSSARY.md) mode=full ;;
                # Marketplace adoption and error contracts are canonical runtime policy, not research.
                docs/platforms/*/ENDPOINT_MATRIX.md|docs/platforms/*/ERRORS.md) mode=full ;;
                # Only Markdown prose is light; data, schemas and evidence files are not.
                *.md) ;;
                *) mode=full ;;
              esac
            done <<< "$files"
            printf '%s\n' "$files"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "CI scope: $mode"

  quality:
    name: Lint, format, type check
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  docs-validation:
    name: Docs validation (unit and doc-contract tests)
    needs: [scope]
    if: needs.scope.outputs.mode == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # The unit suite pins the canonical documents (ARCHITECTURE, ADRs, ERRORS.md, ROADMAP ...).
      - run: pytest tests/unit -q

  tests:
    name: Tests (${{ matrix.os }})
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: pytest -v

  migrations:
    name: Migration check
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Empty database -> head, models match, downgrade/upgrade round trip
        env:
          ICBM_DATA_DIR: ${{ runner.temp }}/migration-check
        run: |
          icbm db upgrade
          test "$(icbm db current)" = "$(alembic heads | cut -d ' ' -f 1)"
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

  m5-offline-acceptance:
    name: M5 offline acceptance (provider-zero, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # A fresh dedicated root outside the checkout and every data directory. The run refuses a
      # dirty checkout itself, and its report states the measured provider counters.
      - name: Run the M5 offline acceptance harness
        run: python scripts/m5_acceptance.py --root "${{ runner.temp }}/m5-acceptance"
      - name: Verify the report digest
        run: >-
          python scripts/m5_acceptance.py --verify
          "${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json"
      - name: Prove the run reached no marketplace and mutated nothing
        run: >-
          python -c "import json,sys;
          r=json.load(open(sys.argv[1]));
          g=r['guards'];
          assert r['problems']==[], r['problems'];
          assert r['boundary']['marketplace_mutations']==0;
          assert g['external_network_attempts']==0 and g['egress_grants_opened']==0;
          assert g['forbidden_modules_loaded_during_run']==[];
          assert r['canary_readiness']['verdict']=='BLOCKED';
          print('outbound marketplace mutations:', r['boundary']['marketplace_mutations'])"
          "${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m5-offline-acceptance-evidence
          path: ${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json
          if-no-files-found: error

  acceptance:
    name: M0 acceptance (Windows, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Run the M0 acceptance flow (real processes, restarts, visual check)
        run: python scripts/m0_acceptance.py --visual --out "${{ runner.temp }}/m0-acceptance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m0-acceptance-evidence
          path: ${{ runner.temp }}/m0-acceptance
          if-no-files-found: error

  g3-visual-acceptance:
    name: Gate 3 populated visual acceptance (Windows, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # ADR-0018 §9: the populated first-vertical scenario in a real browser, every required surface
      # at 1920x1080 and 1080x1920. The run refuses a dirty checkout itself. Its report is evidence
      # of this exact commit only; nothing here records a visual acceptance (only the reviewed
      # `icbm live record-visual-acceptance` command does, at the report's own commit).
      - name: Run the populated visual acceptance harness
        run: python scripts/g3_visual_acceptance.py run --root "${{ runner.temp }}/g3-visual"
      - name: Verify the report against the contract
        run: python scripts/g3_visual_acceptance.py verify "${{ runner.temp }}/g3-visual/g3-visual-report.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: g3-visual-acceptance-evidence
          path: |
            ${{ runner.temp }}/g3-visual/g3-visual-report.json
            ${{ runner.temp }}/g3-visual/screens
          if-no-files-found: error

  ci-gate:
    name: CI gate
    needs:
      - scope
      - quality
      - docs-validation
      - tests
      - migrations
      - m5-offline-acceptance
      - acceptance
      - g3-visual-acceptance
    # A draft PR is not a merge candidate, so it gets no gate result at all.
    if: always() && needs.scope.outputs.mode != 'wip'
    runs-on: ubuntu-latest
    steps:
      - name: Every job this scope requires succeeded on this exact HEAD
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          QUALITY: ${{ needs.quality.result }}
          DOCS: ${{ needs.docs-validation.result }}
          TESTS: ${{ needs.tests.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          M5: ${{ needs.m5-offline-acceptance.result }}
          M0: ${{ needs.acceptance.result }}
          G3: ${{ needs.g3-visual-acceptance.result }}
        run: |
          set -u
          case "$MODE" in
            full) required="SCOPE QUALITY TESTS MIGRATIONS M5 M0 G3" ;;
            docs) required="SCOPE QUALITY DOCS" ;;
            *) echo "unknown CI scope '$MODE'"; exit 1 ;;
          esac
          fail=0
          for name in $required; do
            result="${!name}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then fail=1; fi
          done
          echo "CI scope $MODE: $([ $fail -eq 0 ] && echo PASS || echo FAIL)"
          exit $fail
