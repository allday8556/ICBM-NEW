name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  quality:
    name: Lint, format, type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: pytest

  migrations:
    name: Migration check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Empty database -> head, models match, downgrade/upgrade round trip
        env:
          ICBM_DATA_DIR: ${{ runner.temp }}/migration-check
        run: |
          icbm db upgrade
          test "$(icbm db current)" = "0001_m0_foundation"
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

  acceptance:
    name: M0 acceptance (Windows, clean checkout)
    needs: [quality, tests, migrations]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Run the M0 acceptance flow (real processes, restarts, visual check)
        run: python scripts/m0_acceptance.py --visual --out "${{ runner.temp }}/m0-acceptance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m0-acceptance-evidence
          path: ${{ runner.temp }}/m0-acceptance
          if-no-files-found: error
