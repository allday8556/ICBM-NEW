name: CI

# Risk-scoped CI policy (rule §14.2):
# - basic: docs/control-plane/simple internal changes; quality plus unit/contract/harness checks;
# - provider_zero: feature/integration code with no real external side effect, including read-only
#   provider paths; functional tests, migrations and the provider-zero acceptance harness;
# - full: high-risk changes selected by protected paths or the risk:high label;
# - workflow_dispatch: final-LIVE verification on final main, including visual evidence;
# - wip: draft PR quality only, with no CI gate.
# A mixed change takes the highest tier. The high-risk path allowlist below is fail-closed for the
# safety-critical owners; adding another such owner requires adding it here in the same PR.
# Branch pushes without a PR run nothing. "CI gate" is the single merge-readiness result.
#
# Exact-HEAD invariant: on a pull_request event actions/checkout defaults to the ephemeral
# refs/pull/N/merge commit, which is base + head and is not the stated commit. Every job therefore
# pins ref to github.event.pull_request.head.sha (github.sha on push/dispatch), so a green "CI gate"
# means that exact HEAD passed, with nothing from the base branch mixed in.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      final_live: ${{ steps.scope.outputs.final_live }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - id: scope
        name: Classify this run (basic | provider_zero | full | wip)
        env:
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HIGH_RISK_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'risk:high') }}
        run: |
          set -euo pipefail
          final_live=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode=full
            final_live=true
          elif [ "$EVENT" != "pull_request" ]; then
            mode=provider_zero
          elif [ "$DRAFT" = "true" ]; then
            mode=wip
          else
            # The checkout is pinned to the exact head SHA, not to the merge ref that used to carry
            # the base commit as a parent, so make both endpoints present before comparing them.
            git fetch --no-tags --quiet origin "$BASE_SHA" "$HEAD_SHA"
            files="$(git diff --name-only --no-renames "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA")"
            mode=basic
            if [ -z "$files" ]; then
              mode=provider_zero
            fi
            high=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # These owners directly control a side-effecting send, UNKNOWN/replay identity,
              # credentials, or a core safety gate. Safety-owning directories are fail-closed:
              # only the exact provider-zero/read-only files named below stay out of HIGH_RISK.
              case "$f" in
                app/stages/register/authoring.py|app/stages/register/authoring_revisions.py|app/stages/register/builder.py|app/stages/register/category_metadata.py|app/stages/register/category_metadata_models.py|app/stages/register/contracts.py|app/stages/register/drafting.py|app/stages/register/marketplace_option_projection.py|app/stages/register/marketplace_requirement_mapping.py|app/stages/register/payload.py|app/stages/register/preparation.py|app/stages/register/sanitize.py|app/stages/register/target_policy.py|app/stages/register/target_policy_models.py|integrations/marketplaces/smartstore/__init__.py|integrations/marketplaces/smartstore/lookup.py|integrations/marketplaces/smartstore/product.py|integrations/marketplaces/smartstore/readback.py|integrations/marketplaces/smartstore/search.py) ;;
                .github/workflows/*|automation/agent-host/*.ps1|app/capabilities/live_safety/*|app/container.py|app/platform/core/*|app/platform/system/execution_mode.py|app/platform/system/secret_scan.py|app/stages/register/*|app/stages/connect/accounts.py|app/stages/connect/account_models.py|app/stages/connect/credentials.py|app/stages/connect/service.py|app/stages/connect/sessions.py|app/stages/connect/smartstore/credentials.py|app/stages/connect/smartstore/models.py|app/stages/connect/smartstore/service.py|app/platform/db/migrations/versions/0006_m2_marketplace_connections.py|app/platform/db/migrations/versions/0016_m5_registration_foundation.py|app/platform/db/migrations/versions/0017_m5_registration_execution_scope.py|app/platform/db/migrations/versions/0026_g3_live_authority.py|app/platform/db/migrations/versions/0029_g3_restore_retention.py|app/platform/db/migrations/versions/0030_g3_visual_acceptance.py|app/platform/db/migrations/versions/0031_m5_registration_reconcile.py|app/platform/db/migrations/versions/0033_m5_canary_eligibility.py|app/platform/db/migrations/versions/0036_g3_residual_risk_acceptance.py|integrations/marketplaces/*|documents/rules/06-immutable-domain-rules.md|documents/rules/07-execution-safety.md|documents/rules/14-operating-authority.md|documents/rules/agent-host/AGENT_HOST_AUDIT_PROTOCOL.md|documents/decisions/adr/0014-*|documents/decisions/adr/0018-*|documents/decisions/adr/0020-*|documents/decisions/adr/0022-*) high=true ;;
              esac
              # BASIC is an allowlist. Anything else is at least PROVIDER_ZERO.
              case "$f" in
                *.md|automation/agent-host/*|tests/harness/agent_host/*|tests/contracts/test_repository_rules.py) ;;
                *) [ "$mode" = basic ] && mode=provider_zero ;;
              esac
            done <<< "$files"
            if [ "$HIGH_RISK_LABEL" = "true" ] || [ "$high" = "true" ]; then
              mode=full
            fi
            printf '%s\n' "$files"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "final_live=$final_live" >> "$GITHUB_OUTPUT"
          echo "CI scope: $mode"

  quality:
    name: Lint, format, type check
    needs: [scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  basic-validation:
    name: Basic validation (unit, contract and harness tests)
    needs: [scope]
    if: needs.scope.outputs.mode == 'basic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # The unit, doc-contract and harness-unit suites pin the canonical documents (ARCHITECTURE,
      # ADRs, ERRORS.md, ROADMAP ...). Issue #151 moved the doc-contract tests to tests/contracts and
      # the harness unit tests to tests/harness; "not integration" keeps exactly the set that
      # tests/unit held before the move (the moved integration harness tests carry that marker).
      - run: pytest tests/unit tests/contracts tests/harness -m "not integration" -q

  tests:
    name: Tests (${{ matrix.os }})
    needs: [scope]
    # Not gated by tier at job level: a matrix job skipped by its own `if` reports one unexpanded
    # "Tests (${{ matrix.os }})" check instead of the two required "Tests (<os>)" checks, so a basic
    # PR could never merge. Outside a draft the matrix always expands; the steps run only where the
    # scope requires the full suite, and in basic scope the job ends without running anything.
    # "CI gate" stays the merge-readiness result: it requires TESTS only for provider_zero and full.
    if: needs.scope.outputs.mode != 'wip'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN_SUITE: ${{ needs.scope.outputs.mode == 'provider_zero' || needs.scope.outputs.mode == 'full' }}
    steps:
      - uses: actions/checkout@v5
        if: env.RUN_SUITE == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        if: env.RUN_SUITE == 'true'
        with:
          python-version: "3.12"
      - if: env.RUN_SUITE == 'true'
        run: python -m pip install -c constraints.txt -e ".[dev]"
      # The suite runs in parallel across the runner's cores (pytest-xdist; owner decision
      # 2026-10-11). `--dist load` hands out single tests, so no test may rely on another's state.
      - if: env.RUN_SUITE == 'true'
        run: pytest -v -n auto --dist load
      - if: env.RUN_SUITE != 'true'
        run: echo "CI scope ${{ needs.scope.outputs.mode }} does not run the full suite"

  migrations:
    name: Migration check
    needs: [scope]
    if: needs.scope.outputs.mode == 'provider_zero' || needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Empty database -> head, models match, downgrade/upgrade round trip
        env:
          ICBM_DATA_DIR: ${{ runner.temp }}/migration-check
        run: |
          icbm db upgrade
          test "$(icbm db current)" = "$(alembic heads | cut -d ' ' -f 1)"
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check

  m5-offline-acceptance:
    name: M5 offline acceptance (provider-zero, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.mode == 'provider_zero' || needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # A fresh dedicated root outside the checkout and every data directory. The run refuses a
      # dirty checkout itself, and its report states the measured provider counters.
      - name: Run the M5 offline acceptance harness
        run: python automation/acceptance/m5/m5_acceptance.py --root "${{ runner.temp }}/m5-acceptance"
      - name: Verify the report digest
        run: >-
          python automation/acceptance/m5/m5_acceptance.py --verify
          "${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json"
      - name: Prove the run reached no marketplace and mutated nothing
        run: >-
          python -c "import json,sys;
          r=json.load(open(sys.argv[1]));
          g=r['guards'];
          assert r['problems']==[], r['problems'];
          assert r['boundary']['marketplace_mutations']==0;
          assert g['external_network_attempts']==0 and g['egress_grants_opened']==0;
          assert g['forbidden_modules_loaded_during_run']==[];
          assert r['canary_readiness']['verdict']=='BLOCKED';
          print('outbound marketplace mutations:', r['boundary']['marketplace_mutations'])"
          "${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m5-offline-acceptance-evidence
          path: ${{ runner.temp }}/m5-acceptance/m5-acceptance-report.json
          if-no-files-found: error

  acceptance:
    name: M0 acceptance (Windows, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.mode == 'full'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      - name: Run the M0 acceptance flow (real processes, restarts, visual check)
        run: python automation/acceptance/m0/m0_acceptance.py --visual --out "${{ runner.temp }}/m0-acceptance"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: m0-acceptance-evidence
          path: ${{ runner.temp }}/m0-acceptance
          if-no-files-found: error

  g3-visual-acceptance:
    name: Gate 3 populated visual acceptance (Windows, clean checkout)
    needs: [scope, quality, tests, migrations]
    if: needs.scope.outputs.final_live == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints.txt -e ".[dev]"
      # ADR-0018 §9: the populated first-vertical scenario in a real browser, every required surface
      # at 1920x1080 and 1080x1920. The run refuses a dirty checkout itself. Its report is evidence
      # of this exact commit only; nothing here records a visual acceptance (only the reviewed
      # `icbm live record-visual-acceptance` command does, at the report's own commit).
      - name: Run the populated visual acceptance harness
        run: python automation/acceptance/gate3_visual/g3_visual_acceptance.py run --root "${{ runner.temp }}/g3-visual"
      - name: Verify the report against the contract
        run: python automation/acceptance/gate3_visual/g3_visual_acceptance.py verify "${{ runner.temp }}/g3-visual/g3-visual-report.json"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: g3-visual-acceptance-evidence
          path: |
            ${{ runner.temp }}/g3-visual/g3-visual-report.json
            ${{ runner.temp }}/g3-visual/screens
          if-no-files-found: error

  ci-gate:
    name: CI gate
    needs:
      - scope
      - quality
      - basic-validation
      - tests
      - migrations
      - m5-offline-acceptance
      - acceptance
      - g3-visual-acceptance
    # A draft PR is not a merge candidate, so it gets no gate result at all.
    if: always() && needs.scope.outputs.mode != 'wip'
    runs-on: ubuntu-latest
    steps:
      - name: Every job this scope requires succeeded on this exact HEAD
        env:
          MODE: ${{ needs.scope.outputs.mode }}
          SCOPE: ${{ needs.scope.result }}
          QUALITY: ${{ needs.quality.result }}
          BASIC: ${{ needs.basic-validation.result }}
          TESTS: ${{ needs.tests.result }}
          MIGRATIONS: ${{ needs.migrations.result }}
          M5: ${{ needs.m5-offline-acceptance.result }}
          M0: ${{ needs.acceptance.result }}
          G3: ${{ needs.g3-visual-acceptance.result }}
          FINAL_LIVE: ${{ needs.scope.outputs.final_live }}
        run: |
          set -u
          case "$MODE" in
            basic) required="SCOPE QUALITY BASIC" ;;
            provider_zero) required="SCOPE QUALITY TESTS MIGRATIONS M5" ;;
            full)
              required="SCOPE QUALITY TESTS MIGRATIONS M5 M0"
              if [ "$FINAL_LIVE" = "true" ]; then required="$required G3"; fi
              ;;
            *) echo "unknown CI scope '$MODE'"; exit 1 ;;
          esac
          fail=0
          for name in $required; do
            result="${!name}"
            echo "$name=$result"
            if [ "$result" != "success" ]; then fail=1; fi
          done
          echo "CI scope $MODE: $([ $fail -eq 0 ] && echo PASS || echo FAIL)"
          exit $fail
