# Alembic CLI configuration. The application itself migrates through `icbm db upgrade`
# (app/platform/db/migrate.py), which builds the same configuration programmatically.
[alembic]
script_location = app/platform/db/migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally absent: env.py resolves it from ICBM configuration
# (ICBM_DATA_DIR) so the CLI and the application always target the same database.
