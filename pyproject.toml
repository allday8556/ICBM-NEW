[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "icbm-new"
version = "0.1.0"
description = "ICBM-NEW local single-user commerce operations application"
readme = "README.md"
requires-python = ">=3.12"
# Pinned v1 stack: documents/architecture/ARCHITECTURE.md §2 and ADR-0001. Exact resolved versions live in
# constraints.txt; CI installs with `-c constraints.txt`.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.8,<3",
    "keyring>=25",
    # Supplier session blobs at rest: AES-256-GCM, key in the OS secret store (ADR-0007).
    "cryptography>=43",
    # Browser authentication where a supplier requires it (ADR-0001, ADR-0007).
    "playwright>=1.47",
    # SmartStore token request signature: bcrypt over client_id_timestamp with the client
    # secret as the salt (documents/contracts/platforms/smartstore/AUTH.md §4). Added for M2 PR-A.
    "bcrypt>=5.0",
    # Detail Guidance notice images: one deterministic renderer (ADR-0033 §3).
    "pillow==12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
icbm = "app.interface.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "integrations*"]

[tool.setuptools.package-data]
app = [
    "db/migrations/script.py.mako",
    "capabilities/ai/seed_v29.json",
    "capabilities/detail_guidance/fonts/NotoSansKR-wght.ttf",
    "capabilities/detail_guidance/fonts/OFL.txt",
]
integrations = ["marketplaces/smartstore/notice_schema.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# Korean UI copy legitimately contains characters RUF001-003 consider ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "automation", "integrations", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/platform/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# The M2 acceptance harness (Issue #46 §2) and the M3 reconnaissance harness (Issue #52 §3,
# ADR-0010 §5) are acceptance tooling, type-checked like production; so is the Adaptive Phase C
# campaign harness (Issue #110 C1 PREP-0 5841947773).
packages = [
    "app",
    "integrations",
    "automation.acceptance.m2.harness",
    "automation.acceptance.m3.recon",
    "automation.acceptance.m3.rehearsal",
    "automation.acceptance.m3.campaign",
    "automation.acceptance.common",
    "automation.acceptance.m4",
    "automation.adaptive.phase_c.harness",
]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Issue #151 kept the pre-restructure relative order: the acceptance-harness tests (some of which
# deliberately trip the process-wide egress guard) run after the integration suite, as they did
# when they lived in tests/integration and tests/unit. The four directories hold every test
# module (tests/support and tests/fixtures hold none); tests/contracts/test_repository_rules.py
# (test_testpaths_collect_every_test_module) proves it.
testpaths = ["tests/contracts", "tests/integration", "tests/harness", "tests/unit"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises the database, migrations or the running application",
]
