[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "icbm-new"
version = "0.1.0"
description = "ICBM-NEW local single-user commerce operations application"
readme = "README.md"
requires-python = ">=3.12"
# Pinned v1 stack: docs/ARCHITECTURE.md §2 and ADR-0001. Exact resolved versions live in
# constraints.txt; CI installs with `-c constraints.txt`.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic>=2.8,<3",
    "keyring>=25",
    # Supplier session blobs at rest: AES-256-GCM, key in the OS secret store (ADR-0007).
    "cryptography>=43",
    # Browser authentication where a supplier requires it (ADR-0001, ADR-0007).
    "playwright>=1.47",
    # SmartStore token request signature: bcrypt over client_id_timestamp with the client
    # secret as the salt (docs/platforms/smartstore/AUTH.md §4). Added for M2 PR-A.
    "bcrypt>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
icbm = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "integrations*"]

[tool.setuptools.package-data]
app = ["db/migrations/script.py.mako"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
# Korean UI copy legitimately contains characters RUF001-003 consider ambiguous.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app", "integrations", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# The M2 acceptance harness (Issue #46 §2) is acceptance tooling, type-checked like production.
packages = ["app", "integrations", "scripts.m2harness"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["keyring", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: exercises the database, migrations or the running application",
]
